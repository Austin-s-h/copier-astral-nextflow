name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make install
      - run: make verify

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make install
      - run: make test-cov

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error

  nextflow-template-integration:
    name: Nextflow Template Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install template dependencies
        run: make install

      - name: Render hybrid Nextflow project
        run: |
          set -euo pipefail
          output_dir="$(mktemp -d)"
          uv run copier copy . "$output_dir" --vcs-ref HEAD --defaults --force --trust \
            -d project_name="Integration Project" \
            -d project_description="Integration smoke test" \
            -d project_slug="integration_project" \
            -d author_name="CI" \
            -d author_email="ci@example.com" \
            -d github_username="testuser" \
            -d repository_name="integration-project" \
            -d project_type="hybrid_python_nextflow" \
            -d include_nextflow=true \
            -d include_docker=false \
            -d include_docs=false \
            -d include_github_actions=false \
            -d include_prek=false \
            -d include_bio_defaults=true \
            -d nextflow_default_profile="local" \
            -d nextflow_config_style="single_nextflow_config"
          echo "OUTPUT_DIR=$output_dir" >> "$GITHUB_ENV"

      - name: Set up Nextflow 25
        uses: nf-core/setup-nextflow@v2
        with:
          version: "25.10.4"
          java-version: "17"
          java-distribution: "temurin"

      - name: Verify Nextflow installation
        run: nextflow -version

      - name: Run Nextflow smoke test
        env:
          NXF_SYNTAX_PARSER: v2
        run: |
          cd "$OUTPUT_DIR"
          nextflow config -profile local
          nextflow run . -profile test,local --input "data/test/samplesheet.csv" --outdir results-ci
          compgen -G "results-ci/pipeline_info/trace_*.txt" > /dev/null
          compgen -G "results-ci/pipeline_info/report_*.html" > /dev/null
          compgen -G "results-ci/pipeline_info/timeline_*.html" > /dev/null

  secrets_and_dependency_scan:
    name: Secret and Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
      - run: make install
      - run: make pysentry

  sast_with_semgrep:
    name: semgrep scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    # Skip any PRs created by dependabot or renovate to avoid permission issues:
    if: ${{ github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]' && github.actor != 'Renovate[bot]' }}

    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan
